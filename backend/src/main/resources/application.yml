server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  web:
    error:
      include-message: never
      include-stacktrace: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ticketpoint}
    username: ${DB_USER:ticketpoint}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: "SELECT set_config('TimeZone', '${APP_ZONE:Europe/Moscow}', false)"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:ticketpoint}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
logging:
  pattern:
    level: "%5p [request:%X{correlationId}]"
